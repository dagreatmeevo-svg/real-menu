<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Smart Menu – 3D Dish</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 30%,#4a3727 0%,#1b130d 70%)}
body.ar{background:transparent}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.ar #cam{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.glass{background:rgba(20,16,12,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-size:14px}
.top b{font-weight:600}
.top span{opacity:.75;font-size:13px}
#hint{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;font-size:13px;text-align:center;max-width:90%;transition:opacity .5s}
#toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);padding:9px 14px;font-size:13px;text-align:center;max-width:88%;opacity:0;transition:opacity .3s}
#panel{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:12px;pointer-events:auto}
.row{display:flex;align-items:center;gap:10px}
.row label{font-size:13px;white-space:nowrap}
input[type=range]{flex:1;accent-color:#ffb347;height:28px}
.btns{margin-top:8px;gap:8px}
button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-family:inherit}
button.on{background:#ffb347;color:#2a1a08;border-color:#ffb347;font-weight:600}
button[hidden]{display:none}
.note{margin-top:8px;font-size:11px;opacity:.6;text-align:center}
.note.credit{margin-top:4px;font-size:10px;opacity:.5}
.note.credit a{color:inherit}
.note[hidden]{display:none}
.label{position:absolute;right:8px;top:0;text-align:right;font-size:12px;line-height:1.25;padding:3px 8px 3px 10px;border-radius:8px;background:rgba(20,16,12,.7);border-right:3px solid #ffb347;opacity:0;pointer-events:none;will-change:transform}
.label span{display:block;opacity:.8;font-size:11px}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;font-size:13px}
#loading[hidden]{display:none}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="ui">
  <div class="top glass"><b id="dishEn">Smart Menu</b><span id="dishAr" dir="rtl">قائمة ذكية</span></div>
  <div id="hint" class="glass">Drag to rotate · pinch to zoom · slide to explode</div>
  <div id="labels"></div>
  <div id="loading" class="glass">Loading dish…</div>
  <div id="toast" class="glass"></div>
  <div id="panel" class="glass">
    <div class="row">
      <label for="exp">Explode · تفكيك</label>
      <input id="exp" type="range" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="row btns">
      <button id="btnCam">Camera</button>
      <button id="btnSpin" class="on">Auto-rotate</button>
      <button id="btnAR" hidden>Place on table (AR)</button>
    </div>
    <div class="note">Camera mode works on any phone. Real table anchoring works on Android Chrome.</div>
    <div class="note credit" id="credit" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('gl'), video = $('cam'), hint = $('hint'), toast = $('toast');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;

  let toastT;
  function say(msg, ms) {
    toast.textContent = msg;
    toast.style.opacity = 1;
    clearTimeout(toastT);
    toastT = setTimeout(() => { toast.style.opacity = 0; }, ms || 5000);
  }

  if (typeof THREE === 'undefined') {
    say('Could not load the 3D library. Check your connection.', 8000);
    return;
  }

  /* ---------- renderer / scene ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

  // soft studio-style reflections (makes plate, cheese and tomato look glossy)
  try {
    const pm = new THREE.PMREMGenerator(renderer);
    const es = new THREE.Scene();
    es.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.MeshBasicMaterial({ color: 0x6f6a63, side: THREE.BackSide })));
    const panel = (w, h, p, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k * 0.94), side: THREE.DoubleSide }));
      m.position.set(p[0], p[1], p[2]);
      m.lookAt(0, 0, 0);
      es.add(m);
    };
    panel(12, 7, [8, 10, 7], 9);
    panel(9, 6, [-10, 6, 3], 3.5);
    panel(16, 4, [0, 12, -8], 4);
    scene.environment = pm.fromScene(es, 0.04).texture;
    pm.dispose();
  } catch (e) { /* lighting below still works without it */ }

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6f52, 0.35));

  const srgb = (c) => new THREE.Color(c).convertSRGBToLinear();
  const mat = (c, r, extra) => new THREE.MeshStandardMaterial(Object.assign(
    { color: srgb(c), roughness: r === undefined ? 0.7 : r, metalness: 0 }, extra || {}));

  /* ---------- procedural textures (no image files needed) ---------- */
  function rnd(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function canvasTex(w, h, draw, opt) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = opt && opt.linear ? THREE.LinearEncoding : THREE.sRGBEncoding;
    t.anisotropy = 4;
    if (opt && opt.repeat) {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(opt.repeat[0], opt.repeat[1]);
    }
    return t;
  }
  function speckle(ctx, w, h, r, n, cols, minR, maxR, alpha) {
    for (let i = 0; i < n; i++) {
      ctx.globalAlpha = alpha * (0.4 + 0.6 * r());
      ctx.fillStyle = cols[(r() * cols.length) | 0];
      ctx.beginPath();
      ctx.arc(r() * w, r() * h, minR + r() * (maxR - minR), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function noiseBump(seed, n, lo, hi) {
    return canvasTex(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
      speckle(ctx, w, h, rnd(seed), n, ['#555555', '#aaaaaa', '#6a6a6a', '#959595'], lo, hi, 0.55);
    }, { linear: true });
  }

  function bunTex(top, seed) {
    return canvasTex(512, 256, (ctx, w, h) => {
      const r = rnd(seed);
      const g = ctx.createLinearGradient(0, 0, 0, h);
      if (top) { g.addColorStop(0, '#8f4a14'); g.addColorStop(0.5, '#b8661f'); g.addColorStop(1, '#d4953f'); }
      else { g.addColorStop(0, '#d9a04e'); g.addColorStop(1, '#c78d3f'); }
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      speckle(ctx, w, h, r, 2600, ['#8a4a14', '#b9742a', '#e8b672'], 1, 5, 0.07);
      speckle(ctx, w, h, r, 420, ['#6e3a10'], 2, 6, 0.08);
    });
  }
  function crumbTex() {
    return canvasTex(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#f1dcae'; ctx.fillRect(0, 0, w, h);
      speckle(ctx, w, h, rnd(7), 1400, ['#dfc185', '#fff0cc', '#e8cd96'], 1, 4, 0.5);
      speckle(ctx, w, h, rnd(8), 120, ['#c9a468'], 2, 5, 0.35);
    });
  }
  function pattyTex(cap) {
    return canvasTex(512, 512, (ctx, w, h) => {
      const r = rnd(cap ? 11 : 12);
      ctx.fillStyle = '#4b2918'; ctx.fillRect(0, 0, w, h);
      speckle(ctx, w, h, r, 6500, ['#2b150b', '#6c3c22', '#3a1d10', '#8a5332'], 1, 5, 0.5);
      if (cap) {
        ctx.save();
        ctx.translate(w / 2, h / 2); ctx.rotate(-0.6);
        ctx.globalAlpha = 0.5; ctx.fillStyle = '#1b0d06';
        for (let i = -3; i <= 3; i++) ctx.fillRect(-w, i * 72 - 12, w * 2, 26);
        ctx.restore(); ctx.globalAlpha = 1;
      }
    });
  }
  function tomatoTex() {
    return canvasTex(512, 512, (ctx, w, h) => {
      const cx = w / 2, cy = h / 2, R = w / 2;
      ctx.fillStyle = '#b8201b'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#d63a2b'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.9, 0, TAU); ctx.fill();
      for (let i = 0; i < 6; i++) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(i * Math.PI / 3);
        ctx.fillStyle = '#ea6650'; ctx.beginPath(); ctx.ellipse(R * 0.46, 0, R * 0.3, R * 0.17, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f1db8d';
        for (let k = 0; k < 5; k++) {
          ctx.beginPath();
          ctx.ellipse(R * (0.34 + k * 0.06), (k % 2 ? 1 : -1) * R * 0.05, R * 0.026, R * 0.013, 0.5, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.fillStyle = '#f5c3b0'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.12, 0, TAU); ctx.fill();
    });
  }
  function lettuceTex() {
    return canvasTex(512, 512, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
      g.addColorStop(0, '#bde377'); g.addColorStop(0.6, '#78bb3c'); g.addColorStop(1, '#4e9a29');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(228,246,176,0.55)'; ctx.lineWidth = 3;
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * TAU;
        ctx.beginPath(); ctx.moveTo(w / 2, h / 2);
        ctx.quadraticCurveTo(w / 2 + Math.cos(a + 0.3) * w * 0.25, h / 2 + Math.sin(a + 0.3) * h * 0.25,
          w / 2 + Math.cos(a) * w * 0.5, h / 2 + Math.sin(a) * h * 0.5);
        ctx.stroke();
      }
      speckle(ctx, w, h, rnd(5), 1500, ['#3f8a22', '#9fd45c'], 1, 4, 0.12);
    });
  }
  const woodTex = canvasTex(1024, 1024, (ctx, w, h) => {
    const r = rnd(99), n = 5, pw = w / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = 'hsl(' + (20 + r() * 6) + ',50%,' + (20 + r() * 6) + '%)';
      ctx.fillRect(i * pw, 0, pw, h);
      for (let k = 0; k < 100; k++) {
        const x0 = i * pw + r() * pw;
        ctx.strokeStyle = r() < 0.5 ? 'rgba(40,20,8,' + (0.05 + r() * 0.12) + ')' : 'rgba(210,150,100,' + (0.04 + r() * 0.08) + ')';
        ctx.lineWidth = 0.5 + r() * 1.6;
        ctx.beginPath(); ctx.moveTo(x0, 0);
        for (let y = 0; y <= h; y += 64) ctx.lineTo(x0 + Math.sin(y * 0.01 + k) * 3 + Math.sin(y * 0.03 + i) * 2, y);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(18,9,3,0.9)'; ctx.fillRect(i * pw, 0, 3, h);
    }
  }, { repeat: [14, 14] });

  /* ---------- world: table, plate, dish ---------- */
  const rig = new THREE.Group();   // placed on the real table in AR
  const spin = new THREE.Group();  // 360 rotation
  const inner = new THREE.Group(); // holds the dish; its bottom sits at y = 0
  rig.add(spin);
  spin.add(inner);
  scene.add(rig);

  // key light lives in the rig so its shadows follow the dish in AR
  const sun = new THREE.DirectionalLight(0xfff1dc, 1.1);
  sun.position.set(3, 6, 4);
  sun.target.position.set(0, 1.2, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -5; sc.right = 5; sc.top = 6; sc.bottom = -6; sc.near = 1; sc.far = 20;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  sun.shadow.radius = 3;
  rig.add(sun);
  rig.add(sun.target);

  // wooden table
  const table = new THREE.Mesh(
    new THREE.BoxGeometry(80, 0.4, 80),
    mat(0xb8a090, 0.5, { map: woodTex })
  );
  table.position.y = -0.28;
  table.receiveShadow = true;
  rig.add(table);

  // ceramic plate
  const plate = new THREE.Mesh(
    new THREE.LatheGeometry([
      [0, 0.08], [1.0, 0.08], [1.45, 0.12], [1.7, 0.16], [1.73, 0.155],
      [1.7, 0.145], [1.45, 0.1], [1.0, 0.05], [0.85, 0], [0, 0]
    ].map((p) => new THREE.Vector2(p[0], p[1])), 96),
    mat(0xf6f3ee, 0.18, { side: THREE.DoubleSide })
  );
  plate.position.y = -0.08;
  plate.receiveShadow = true;
  rig.add(plate);

  // invisible ground that only shows the dish's shadow (camera / AR modes)
  const catcher = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10).rotateX(-Math.PI / 2),
    new THREE.ShadowMaterial({ opacity: 0.35 })
  );
  catcher.position.y = 0.002;
  catcher.receiveShadow = true;
  catcher.visible = false;
  rig.add(catcher);

  /* ---------- procedural burger (fallback when no GLB is available) ---------- */
  function dome(top, seed) {
    const g = new THREE.Group();
    const geo = top
      ? new THREE.SphereGeometry(1, 64, 32, 0, TAU, 0, Math.PI / 2)
      : new THREE.SphereGeometry(1, 64, 32, 0, TAU, Math.PI / 2, Math.PI / 2);
    const m = new THREE.Mesh(geo, mat(0xffffff, top ? 0.5 : 0.62, {
      map: bunTex(top, seed), bumpMap: noiseBump(seed + 1, 3200, 0.8, 3), bumpScale: 0.5
    }));
    m.scale.y = top ? 0.75 : 0.35;
    g.add(m);
    const cap = new THREE.Mesh(new THREE.CircleGeometry(0.99, 64), mat(0xffffff, 0.95, { map: crumbTex(), side: THREE.DoubleSide }));
    cap.rotation.x = top ? Math.PI / 2 : -Math.PI / 2;
    g.add(cap);
    return g;
  }

  function topBun() {
    const g = dome(true, 21);
    const seedMat = mat(0xf2e0b2, 0.45);
    const seedGeo = new THREE.SphereGeometry(1, 10, 8);
    const z = new THREE.Vector3(0, 0, 1);
    const r = rnd(2024);
    for (let i = 0; i < 44; i++) {
      const th = Math.acos(1 - r() * 0.6);
      const ph = r() * TAU;
      const p = new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.cos(th) * 0.75, Math.sin(th) * Math.sin(ph));
      const n = new THREE.Vector3(p.x, p.y / 0.5625, p.z).normalize();
      const s = new THREE.Mesh(seedGeo, seedMat);
      s.position.copy(p).multiplyScalar(1.008);
      s.quaternion.setFromUnitVectors(z, n);
      s.rotateZ(r() * Math.PI);
      s.scale.set(0.038, 0.082, 0.024);
      g.add(s);
    }
    return g;
  }

  function patty() {
    const geo = new THREE.CylinderGeometry(0.97, 0.97, 0.28, 72, 5);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      if (Math.hypot(x, z) > 0.6) {
        const a = Math.atan2(z, x);
        const bulge = 1 + 0.05 * (1 - Math.pow(y / 0.14, 2));
        const jit = 1 + 0.025 * Math.sin(a * 11 + y * 8) + 0.02 * Math.sin(a * 23 + 2) + 0.015 * Math.sin(a * 5 - y * 10);
        p.setX(i, x * bulge * jit);
        p.setZ(i, z * bulge * jit);
      }
    }
    geo.computeVertexNormals();
    const side = mat(0xffffff, 0.92, { map: pattyTex(false), bumpMap: noiseBump(31, 2500, 1, 4), bumpScale: 0.6 });
    const top = mat(0xffffff, 0.85, { map: pattyTex(true), bumpMap: noiseBump(32, 2500, 1, 4), bumpScale: 0.6 });
    return new THREE.Mesh(geo, [side, top, top]);
  }

  function cheese() {
    const geo = new THREE.BoxGeometry(1.75, 0.04, 1.75, 14, 1, 14);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const d = Math.max(0, Math.hypot(p.getX(i), p.getZ(i)) - 0.95) / 0.3;
      p.setY(i, p.getY(i) - 0.2 * d * d);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat(0xffc12b, 0.3));
    m.rotation.y = Math.PI / 4;
    return m;
  }

  function tomato() {
    const g = new THREE.Group();
    const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.07, 48);
    const side = mat(0xc9261e, 0.25);
    const face = mat(0xffffff, 0.25, { map: tomatoTex() });
    [[-0.5, 0.3], [0.5, 0.3], [0, -0.55]].forEach((q, i) => {
      const s = new THREE.Mesh(geo, [side, face, face]);
      s.position.set(q[0], 0, q[1]);
      s.rotation.y = i * 1.3;
      g.add(s);
    });
    return g;
  }

  function lettuce() {
    const geo = new THREE.CylinderGeometry(1.06, 1.06, 0.05, 96, 1);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      if (Math.hypot(x, z) > 0.5) {
        const a = Math.atan2(z, x);
        const k = 1 + 0.07 * Math.sin(a * 9) + 0.04 * Math.sin(a * 17 + 1);
        p.setX(i, x * k);
        p.setZ(i, z * k);
        p.setY(i, p.getY(i) + 0.05 * Math.sin(a * 7));
      }
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat(0xffffff, 0.5, { map: lettuceTex(), side: THREE.DoubleSide }));
  }

  const BURGER = {
    id: 'burger',
    name: { en: 'Classic Burger', ar: 'برغر كلاسيك' },
    layers: [
      { en: 'Bottom bun',       ar: 'الخبز السفلي', y: 0.00, make: () => dome(false, 41) },
      { en: 'Beef patty',       ar: 'لحم البرغر',   y: 0.14, make: patty },
      { en: 'Cheese',           ar: 'جبن',          y: 0.31, make: cheese },
      { en: 'Tomato',           ar: 'طماطم',        y: 0.38, make: tomato },
      { en: 'Lettuce',          ar: 'خس',           y: 0.47, make: lettuce },
      { en: 'Top bun · sesame', ar: 'الخبز العلوي', y: 0.55, make: topBun }
    ]
  };

  /* ---------- dish state ---------- */
  // Each layer: { obj, baseY, step, labelOff, el }. Explode moves obj.position.y by explode * step
  // (step is in obj.parent's units). All layers of a dish share one parent.
  const EXPLODE_SPAN = 2.5;   // world units the top layer rises at full explode
  const DISH_WIDTH = 2;       // dishes are normalised to this width in the viewer
  let layers = [];
  let dishHeight = 1.3;       // normalised height, used for camera framing
  let arScale = 0.06;         // world-to-metres scale in AR (2 units -> 12 cm)
  const labelsBox = $('labels');

  function makeLabel(en, ar) {
    const el = document.createElement('div');
    el.className = 'label';
    el.innerHTML = '<b></b><span dir="rtl"></span>';
    el.firstChild.textContent = en || '';
    el.lastChild.textContent = ar || '';
    labelsBox.appendChild(el);
    return el;
  }

  function setTitle(name) {
    $('dishEn').textContent = (name && name.en) || 'Smart Menu';
    $('dishAr').textContent = (name && name.ar) || 'قائمة ذكية';
    document.title = 'Smart Menu – ' + ((name && name.en) || '3D Dish');
  }

  function enableShadows(root) {
    root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  }

  function buildProcedural() {
    const group = new THREE.Group();
    group.position.y = 0.35; // lifts the burger so its bottom sits at y = 0
    inner.add(group);
    const n = BURGER.layers.length;
    layers = BURGER.layers.map((d, i) => {
      const obj = d.make();
      obj.position.y = d.y;
      group.add(obj);
      return { obj: obj, baseY: d.y, step: i * EXPLODE_SPAN / (n - 1), labelOff: 0, el: makeLabel(d.en, d.ar) };
    });
    enableShadows(group);
    dishHeight = 1.3;
    arScale = 0.06;
    setTitle(BURGER.name);
  }

  function buildFromGLTF(gltf, dish) {
    const model = gltf.scene;
    model.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const width = Math.max(size.x, size.z) || 1;
    const s = DISH_WIDTH / width;

    // normalise: centre on x/z, bottom on y = 0, width = DISH_WIDTH
    const group = new THREE.Group();
    group.scale.setScalar(s);
    group.position.set(-(box.min.x + size.x / 2) * s, -box.min.y * s, -(box.min.z + size.z / 2) * s);
    group.add(model);
    inner.add(group);
    group.updateMatrixWorld(true);

    // pull each named layer node up to the group so they all move along the same axis
    const found = [];
    (dish.layers || []).forEach((L) => {
      const node = model.getObjectByName(L.node);
      if (!node) { console.warn('[menu] layer node not found in GLB:', L.node); return; }
      group.attach(node);
      found.push({ node: node, def: L });
    });
    group.updateMatrixWorld(true);

    const n = found.length;
    const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
    layers = found.map((f, i) => {
      const lb = new THREE.Box3().setFromObject(f.node).applyMatrix4(inv);
      const centerY = (lb.min.y + lb.max.y) / 2;
      return {
        obj: f.node,
        baseY: f.node.position.y,
        step: n > 1 ? (i * EXPLODE_SPAN / (n - 1)) / s : 0,
        labelOff: centerY - f.node.position.y,
        el: makeLabel(f.def.en, f.def.ar)
      };
    });
    enableShadows(group);
    dishHeight = size.y * s;
    // true size in AR: dishes.json size_m wins, else assume the GLB is in metres
    const realW = dish.size_m || (width > 0.03 && width < 0.6 ? width : 0.12);
    arScale = realW / DISH_WIDTH;
    setTitle(dish.name);
    if (dish.credit) {
      const c = $('credit');
      c.textContent = '';
      if (dish.credit_url) {
        const a = document.createElement('a');
        a.href = dish.credit_url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = dish.credit;
        c.appendChild(a);
      } else {
        c.textContent = dish.credit;
      }
      c.hidden = false;
    }
    if (dish.layers && n < dish.layers.length) {
      say('Some ingredient layers were not found in this model.', 4000);
    }
  }

  function loadGLB(url) {
    return new Promise((resolve, reject) => {
      if (!THREE.GLTFLoader) return reject(new Error('GLTFLoader missing'));
      const loader = new THREE.GLTFLoader();
      if (THREE.DRACOLoader) {
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
        loader.setDRACOLoader(draco);
      }
      if (typeof MeshoptDecoder !== 'undefined') loader.setMeshoptDecoder(MeshoptDecoder);
      loader.load(url, resolve, undefined, reject);
    });
  }

  async function loadDish() {
    const id = (new URLSearchParams(location.search).get('dish') || 'burger').trim().toLowerCase();
    let dish = null;
    try {
      const res = await fetch('dishes.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      dish = (data.dishes || []).find((d) => d.id === id) || null;
      if (!dish) say('Dish "' + id + '" is not on the menu. Showing the demo burger.', 5000);
    } catch (e) {
      console.warn('[menu] could not read dishes.json:', e);
    }

    if (dish && dish.model) {
      try {
        const gltf = await loadGLB(dish.model);
        buildFromGLTF(gltf, dish);
        $('loading').hidden = true;
        return;
      } catch (e) {
        console.warn('[menu] could not load model', dish.model, e);
        if (dish.id !== 'burger') say('The 3D model for this dish is not ready yet. Showing the demo burger.', 5000);
      }
    }
    buildProcedural();
    if (dish && dish.id === 'burger') setTitle(dish.name);
    $('loading').hidden = true;
  }
  loadDish();

  /* ---------- state ---------- */
  let explodeT = 0, explode = 0;
  let yaw = 0.6, elev = 0.5, zoom = 1;
  let autoSpin = true, camOn = false, arActive = false;
  let hitSource = null;

  /* ---------- reticle for AR ---------- */
  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  /* ---------- sizing ---------- */
  function resize() {
    if (renderer.xr.isPresenting) return;
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- UI ---------- */
  const slider = $('exp'), btnSpin = $('btnSpin'), btnCam = $('btnCam'), btnAR = $('btnAR');
  slider.addEventListener('input', () => { explodeT = parseFloat(slider.value); });
  function syncSpin() { btnSpin.classList.toggle('on', autoSpin); }
  btnSpin.addEventListener('click', () => { autoSpin = !autoSpin; syncSpin(); });
  setTimeout(() => { hint.style.opacity = 0; }, 7000);

  // virtual table + plate only when there is no real one in view
  function updateWorld() {
    const real = camOn || arActive;
    table.visible = !real;
    plate.visible = !real;
    catcher.visible = real;
  }

  async function toggleCam() {
    if (camOn) {
      const s = video.srcObject;
      if (s) s.getTracks().forEach((t) => t.stop());
      video.srcObject = null;
      video.style.display = 'none';
      camOn = false;
      btnCam.classList.remove('on');
      updateWorld();
      return;
    }
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera API');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      await video.play();
      video.style.display = 'block';
      camOn = true;
      btnCam.classList.add('on');
      updateWorld();
      say('Point at your table. The virtual table and plate are hidden, the real ones show.', 4500);
    } catch (e) {
      say('Camera is blocked here. Host this file on HTTPS (GitHub Pages / Netlify) and open it on your phone.', 7000);
    }
  }
  btnCam.addEventListener('click', toggleCam);

  /* ---------- touch / mouse ---------- */
  const ptrs = new Map();
  const pinchDist = () => {
    if (ptrs.size < 2) return 0;
    const a = Array.from(ptrs.values());
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (autoSpin) { autoSpin = false; syncSpin(); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const old = pinchDist();
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      yaw += dx * 0.01;
      elev = clamp(elev + dy * 0.005, 0.05, 1.35);
    } else if (ptrs.size === 2) {
      const nd = pinchDist();
      if (old > 0) zoom = clamp(zoom * nd / old, 0.5, 2.5);
    }
  });
  const endPtr = (e) => { ptrs.delete(e.pointerId); };
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = clamp(zoom * (e.deltaY > 0 ? 0.93 : 1.07), 0.5, 2.5);
  }, { passive: false });

  /* ---------- WebXR (Android Chrome) ---------- */
  async function checkAR() {
    try {
      if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) btnAR.hidden = false;
    } catch (_) {}
  }
  checkAR();

  function onSelect() {
    if (!reticle.visible) return;
    rig.position.setFromMatrixPosition(reticle.matrix);
    rig.scale.setScalar(arScale); // real-world dish size
    rig.visible = true;
    hint.textContent = 'Placed. Walk around it and slide to explode. Tap again to move it.';
    hint.style.opacity = 1;
  }

  async function startAR() {
    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: $('ui') }
      });
      await renderer.xr.setSession(session);
      arActive = true;
      document.body.classList.add('ar');
      rig.visible = false;
      updateWorld();
      hint.textContent = 'Point at the plate or table, then tap to place the dish.';
      hint.style.opacity = 1;
      const viewer = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewer });
      session.addEventListener('select', onSelect);
      session.addEventListener('end', () => {
        arActive = false;
        hitSource = null;
        reticle.visible = false;
        rig.visible = true;
        rig.position.set(0, 0, 0);
        rig.scale.setScalar(1);
        document.body.classList.remove('ar');
        updateWorld();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        resize();
      });
    } catch (e) {
      say('AR could not start: ' + (e && e.message ? e.message : e), 6000);
    }
  }
  btnAR.addEventListener('click', startAR);
  $('panel').addEventListener('beforexrselect', (e) => e.preventDefault());
  $('hint').addEventListener('beforexrselect', (e) => e.preventDefault());

  /* ---------- loop ---------- */
  const v = new THREE.Vector3();

  function frame(time, xrFrame) {
    explode += (explodeT - explode) * 0.12;
    for (let i = 0; i < layers.length; i++) {
      layers[i].obj.position.y = layers[i].baseY + explode * layers[i].step;
    }
    if (autoSpin) yaw += arActive ? 0.004 : 0.006;
    spin.rotation.y = yaw;

    if (!arActive) {
      const aspect = window.innerWidth / window.innerHeight;
      const needH = Math.max(2.7, dishHeight * 2.1) + EXPLODE_SPAN * explode;
      const needW = 5.0;
      const d = Math.max(needH / 0.828, needW / (0.828 * aspect)) / zoom;
      const ty = dishHeight * 0.62 + EXPLODE_SPAN * 0.5 * explode;
      camera.position.set(0, ty + d * Math.sin(elev), d * Math.cos(elev));
      camera.lookAt(0, ty, 0);
    } else if (hitSource && xrFrame) {
      const refSpace = renderer.xr.getReferenceSpace();
      const hits = xrFrame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);

    // ingredient labels (non-AR only)
    const show = !arActive && explode > 0.35;
    for (let i = 0; i < layers.length; i++) {
      const L = layers[i];
      if (!show) { L.el.style.opacity = 0; continue; }
      v.copy(L.obj.position);
      v.y += L.labelOff;
      L.obj.parent.localToWorld(v);
      v.set(0, v.y, 0).project(camera);
      const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
      L.el.style.transform = 'translateY(' + (y - 16).toFixed(1) + 'px)';
      L.el.style.opacity = Math.min(1, (explode - 0.35) / 0.35);
    }
  }
  renderer.setAnimationLoop(frame);
})();
</script>
</body>
</html>
